<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RepoSage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/11.1.1/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.8/purify.min.js"></script>
<style>
  :root {
    --paper: #F7F8FA;
    --surface: #FFFFFF;
    --ink: #12151C;
    --ink-quiet: #565D6B;
    --line: #DEE2E8;
    --accent: #245B6B;
    --accent-ink: #FFFFFF;
    --risk-high-bg: #FBEAE8;
    --risk-high-ink: #9A2F24;
    --risk-medium-bg: #FCF3E3;
    --risk-medium-ink: #8A5A0A;
    --risk-low-bg: #E9F3EC;
    --risk-low-ink: #276A44;
    --radius: 6px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "IBM Plex Sans", -apple-system, sans-serif;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  code, .mono {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
  }

  main {
    max-width: 680px;
    margin: 0 auto;
    padding: 64px 24px 96px;
  }

  header {
    margin-bottom: 40px;
  }

  h1 {
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }

  header p {
    color: var(--ink-quiet);
    margin: 0;
    font-size: 15px;
  }

  form {
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }

  textarea {
    flex: 1;
    resize: none;
    font: inherit;
    font-size: 15px;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px 14px;
    min-height: 48px;
    max-height: 200px;
    transition: border-color 0.15s ease;
  }

  textarea:focus {
    outline: none;
    border-color: var(--accent);
  }

  button {
    font: inherit;
    font-weight: 500;
    font-size: 15px;
    color: var(--accent-ink);
    background: var(--accent);
    border: none;
    border-radius: var(--radius);
    padding: 12px 20px;
    cursor: pointer;
    white-space: nowrap;
    transition: opacity 0.15s ease;
  }

  button:hover:not(:disabled) { opacity: 0.88; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: 0.5; cursor: default; }

  #status {
    margin-top: 18px;
    font-size: 14px;
    color: var(--ink-quiet);
  }

  #status[hidden] { display: none; }

  .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    margin-right: 8px;
    animation: pulse 1.1s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .dot { animation: none; }
  }

  #result { margin-top: 40px; }
  #result[hidden] { display: none; }

  .intent-label {
    font-size: 12px;
    color: var(--ink-quiet);
    margin-bottom: 10px;
  }

  .answer {
    font-size: 16px;
  }

  .answer :is(p, ol, ul) { margin: 0 0 14px; }
  .answer ol, .answer ul { padding-left: 22px; }
  .answer li { margin-bottom: 6px; }
  .answer code {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1px 5px;
    font-size: 0.9em;
  }
  .answer strong { font-weight: 600; }

  .section-label {
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-quiet);
    margin: 32px 0 10px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
  }

  .citations {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .citations li {
    font-family: "IBM Plex Mono", monospace;
    font-size: 13px;
    color: var(--ink-quiet);
  }

  .risk-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .risk-item {
    border-radius: var(--radius);
    padding: 12px 14px;
    font-size: 14px;
  }

  .risk-item .risk-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 4px;
  }

  .risk-item .risk-file {
    font-family: "IBM Plex Mono", monospace;
    font-weight: 500;
  }

  .risk-item .risk-level {
    font-size: 12px;
    font-weight: 500;
  }

  .risk-item.high { background: var(--risk-high-bg); color: var(--risk-high-ink); }
  .risk-item.medium { background: var(--risk-medium-bg); color: var(--risk-medium-ink); }
  .risk-item.low { background: var(--risk-low-bg); color: var(--risk-low-ink); }

  .risk-item .rationale { color: inherit; opacity: 0.85; }

  #error {
    margin-top: 40px;
    border-left: 3px solid var(--risk-high-ink);
    padding: 4px 0 4px 14px;
    font-size: 14px;
  }

  #error[hidden] { display: none; }

  #error .error-title {
    font-weight: 500;
    margin-bottom: 2px;
  }

  #error .error-detail {
    color: var(--ink-quiet);
  }

  #retry-btn {
    margin-top: 10px;
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 6px 14px;
    font-size: 13px;
  }

  #retry-btn[hidden] { display: none; }
  #retry-btn:hover:not(:disabled) { background: var(--accent); color: var(--accent-ink); opacity: 1; }

  @media (max-width: 480px) {
    main { padding: 40px 18px 64px; }
    form { flex-direction: column; }
    button { width: 100%; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>RepoSage</h1>
    <p>Ask what a piece of <span class="mono">httpx</span> code does, or how risky it is to change.</p>
  </header>

  <form id="ask-form">
    <textarea id="question" placeholder="What does Client.send do?" rows="1" required></textarea>
    <button id="submit-btn" type="submit">Ask</button>
  </form>

  <p id="status" hidden><span class="dot"></span>Reading the codebase…</p>

  <div id="error" hidden>
    <div class="error-title" id="error-title">Couldn't answer that.</div>
    <div class="error-detail" id="error-detail"></div>
    <button type="button" id="retry-btn" hidden>Try again</button>
  </div>

  <div id="result" hidden>
    <p class="intent-label" id="intent-label"></p>
    <div class="answer" id="answer"></div>

    <div id="citations-block">
      <p class="section-label">Sources</p>
      <ul class="citations" id="citations"></ul>
    </div>

    <div id="risk-block" hidden>
      <p class="section-label">Risk</p>
      <div class="risk-list" id="risk-list"></div>
    </div>
  </div>
</main>

<script>
  const form = document.getElementById("ask-form");
  const questionInput = document.getElementById("question");
  const submitBtn = document.getElementById("submit-btn");
  const statusEl = document.getElementById("status");
  const errorEl = document.getElementById("error");
  const errorTitleEl = document.getElementById("error-title");
  const errorDetailEl = document.getElementById("error-detail");
  const retryBtn = document.getElementById("retry-btn");
  const resultEl = document.getElementById("result");
  const intentLabelEl = document.getElementById("intent-label");
  const answerEl = document.getElementById("answer");
  const citationsBlock = document.getElementById("citations-block");
  const citationsEl = document.getElementById("citations");
  const riskBlock = document.getElementById("risk-block");
  const riskListEl = document.getElementById("risk-list");

  // Textarea grows with content, single line by default -- matches a
  // single-query tool rather than a multi-line composer.
  questionInput.addEventListener("input", () => {
    questionInput.style.height = "auto";
    questionInput.style.height = questionInput.scrollHeight + "px";
  });

  const INTENT_LABEL = {
    code_explanation: "Code explanation",
    risk_assessment: "Risk assessment",
  };

  async function askQuestion(question) {
    submitBtn.disabled = true;
    statusEl.hidden = false;
    errorEl.hidden = true;
    resultEl.hidden = true;

    try {
      const res = await fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question }),
      });

      if (!res.ok) {
        // ErrorResponse shape: { error_code, message, retryable }. Older
        // failures before this existed (or a proxy/framework-level error
        // that never reaches our handler) might not have this shape, so
        // fall back gracefully rather than showing "undefined".
        const body = await res.json().catch(() => ({}));
        const err = new Error(body.message || `Request failed (${res.status}).`);
        err.retryable = body.retryable === true;
        throw err;
      }

      const data = await res.json();
      renderResult(data);
    } catch (err) {
      errorTitleEl.textContent = err.retryable ? "Couldn't answer that right now." : "Couldn't answer that.";
      errorDetailEl.textContent = err.message || "Something went wrong.";
      retryBtn.hidden = !err.retryable;
      errorEl.hidden = false;
    } finally {
      submitBtn.disabled = false;
      statusEl.hidden = true;
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const question = questionInput.value.trim();
    if (!question) return;
    askQuestion(question);
  });

  retryBtn.addEventListener("click", () => {
    const question = questionInput.value.trim();
    if (question) askQuestion(question);
  });

  function renderResult(data) {
    intentLabelEl.textContent = INTENT_LABEL[data.intent] || data.intent;

    const rawHtml = marked.parse(data.answer || "");
    answerEl.innerHTML = DOMPurify.sanitize(rawHtml);

    if (data.citations && data.citations.length) {
      citationsEl.innerHTML = "";
      data.citations.forEach((c) => {
        const li = document.createElement("li");
        li.textContent = c;
        citationsEl.appendChild(li);
      });
      citationsBlock.hidden = false;
    } else {
      citationsBlock.hidden = true;
    }

    if (data.risk_details && data.risk_details.length) {
      riskListEl.innerHTML = "";
      data.risk_details.forEach((r) => {
        const item = document.createElement("div");
        item.className = "risk-item " + r.risk_level;
        item.innerHTML = `
          <div class="risk-head">
            <span class="risk-file">${escapeHtml(r.file)}.py</span>
            <span class="risk-level">${r.risk_level.toUpperCase()}</span>
          </div>
          <div class="rationale">${escapeHtml(r.rationale)}</div>
        `;
        riskListEl.appendChild(item);
      });
      riskBlock.hidden = false;
    } else {
      riskBlock.hidden = true;
    }

    resultEl.hidden = false;
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }
</script>
</body>
</html>
